<vbox class="main-section">
  <groupbox>
    <label><html:h2>Bars</html:h2></label>
    <checkbox label="Hide tab bar" preference="extensions.togglebars.hideTabs" native="true"/>
    <checkbox label="Hide reader toolbar" preference="extensions.togglebars.hideToolbar" native="true"/>
  </groupbox>
  <groupbox>
    <label><html:h2>Shortcuts</html:h2></label>
    <description>Ctrl+Shift+T hides or shows the tab bar.</description>
    <description>Ctrl+Shift+A hides or shows the reader toolbar.</description>
    <description>Ctrl+Shift+B opens or closes the reader sidebar.</description>
  </groupbox>
</vbox>
